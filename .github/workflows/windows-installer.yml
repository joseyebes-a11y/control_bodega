name: Windows installer verification
on:
  push:
    branches: [fix/windows-installer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:installer
      - run: npm run test:desktop
      - run: npm run build:win
      - name: Install, repair legacy update, uninstall, reinstall and preserve data
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            dist-desktop/*Setup.exe
            dist-desktop/builder-debug.yml
          retention-days: 14
